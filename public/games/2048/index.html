<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>2048</title>
  <link rel="stylesheet" href="style/main.css">
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { display: grid; place-items: center; }
    .container { transform: scale(var(--fit, 1)); transform-origin: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="heading">
      <h1 class="title">2048</h1>
      <div class="scores-container">
        <div class="score-container">0</div>
        <div class="best-container">0</div>
      </div>
    </div>

    <div class="above-game">
      <p class="game-intro">Unisci i numeri uguali con le <strong>frecce</strong>!</p>
      <a class="restart-button">Ricomincia</a>
    </div>

    <div class="game-container">
      <div class="game-message">
        <p></p>
        <div class="lower">
          <a class="keep-playing-button">Continua</a>
          <a class="retry-button">Riprova</a>
        </div>
      </div>

      <div class="grid-container">
        <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
        <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
        <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
        <div class="grid-row"><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div></div>
      </div>

      <div class="tile-container"></div>
    </div>
  </div>

  <script src="../shell.js"></script>
  <script>
    // Scale the board to the screen, whatever its size.
    const container = document.querySelector('.container');
    const fit = () => document.body.style.setProperty('--fit', Math.min(innerWidth * 0.95 / container.offsetWidth, innerHeight * 0.88 / container.offsetHeight, 2));
    addEventListener('resize', fit);
    fit();
  </script>
  <script src="js/bind_polyfill.js"></script>
  <script src="js/classlist_polyfill.js"></script>
  <script src="js/animframe_polyfill.js"></script>
  <script src="js/keyboard_input_manager.js"></script>
  <script src="js/html_actuator.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/tile.js"></script>
  <script src="js/local_storage_manager.js"></script>
  <script src="js/game_manager.js"></script>
  <script src="js/application.js"></script>
</body>
</html>
