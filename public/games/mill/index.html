<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Tria</title>
  <link rel="stylesheet" href="../shell.css">
  <style>
    #board { width: 74vmin; height: 74vmin; }
    #board line, #board rect { stroke: #f0d9b5; stroke-width: 0.12; fill: none; }
    .point { fill: #f0d9b5; cursor: pointer; }
    
    .point.target { fill: #9bd36f; }
    .piece { stroke: rgb(0 0 0 / 0.5); stroke-width: 0.06; pointer-events: none; }
    .piece.w { fill: #fff6e6; }
    .piece.b { fill: #3a2a22; stroke: #f0d9b5; }
    .piece.selected { stroke: #9bd36f; stroke-width: 0.14; }
    .piece.removable { stroke: #ff6b6b; stroke-width: 0.14; }
    #tray { position: fixed; bottom: 7vh; left: 0; right: 0; text-align: center; font-size: 1.4rem; }
  </style>
</head>
<body>
  <p class="top" id="top"></p>
  <svg id="board" viewBox="-1 -1 8 8"></svg>
  <p id="tray"></p>
  <p class="hint">Frecce per spostarti sui punti, Invio per scegliere · fai tria (tre in fila) e togli una pedina · 1 facile · 2 medio · 3 difficile · 4 in due</p>
  <script src="../shell.js"></script>
  <script type="module">
    import { beep, message, tune, LOSE, WIN } from '../kit.js';
    import { POINTS, apply, bestMove, initialState, legalMoves, lost, phase } from './mill.js';

    const LEVELS = { 1: ['facile', 1], 2: ['medio', 2], 3: ['difficile', 3], 4: ['in due', 0] };
    const svg = document.getElementById('board');
    let s;
    let cursor = 0;
    let selected = null;
    let level = '1';
    let thinking = false;
    let over = false;

    function start() {
      s = initialState();
      selected = null;
      over = false;
      message('');
      draw();
    }

    const ns = (tag, attrs) => {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      return el;
    };

    function draw() {
      const moves = legalMoves(s);
      const shapes = [ns('rect', { x: 0, y: 0, width: 6, height: 6 }), ns('rect', { x: 1, y: 1, width: 4, height: 4 }), ns('rect', { x: 2, y: 2, width: 2, height: 2 }),
        ns('line', { x1: 3, y1: 0, x2: 3, y2: 2 }), ns('line', { x1: 3, y1: 4, x2: 3, y2: 6 }), ns('line', { x1: 0, y1: 3, x2: 2, y2: 3 }), ns('line', { x1: 4, y1: 3, x2: 6, y2: 3 })];
      POINTS.forEach(([x, y], i) => {
        const target = selected != null ? moves.some(m => m.from === selected && m.to === i) : phase(s) === 'place' && !s.removing && !s.board[i];
        const point = ns('circle', { cx: x, cy: y, r: 0.16, class: `point${i === cursor ? ' cursor' : ''}${target && (level === '4' || s.turn === 'w') ? ' target' : ''}` });
        point.addEventListener('click', () => {
          cursor = i;
          pick(i);
        });
        shapes.push(point);
        if (s.board[i]) {
          const cls = `piece ${s.board[i]}${i === selected ? ' selected' : ''}${s.removing && moves.some(m => m.remove === i) ? ' removable' : ''}`;
          shapes.push(ns('circle', { cx: x, cy: y, r: 0.4, class: cls }));
        }
        if (i === cursor) shapes.push(ns('circle', { cx: x, cy: y, r: 0.52, fill: 'none', stroke: '#ffd23f', 'stroke-width': 0.1, 'pointer-events': 'none' }));
      });
      svg.replaceChildren(...shapes);
      const who = s.turn === 'w' ? 'Bianco' : 'Nero';
      const doing = s.removing ? 'togli una pedina rossa' : { place: 'metti una pedina', move: 'muovi una pedina', fly: 'salta dove vuoi' }[phase(s)];
      document.getElementById('top').textContent = thinking ? 'Ci penso…'
        : level === '4' || s.turn === 'w' ? `${level === '4' ? who : 'Tocca a te'}: ${doing}` : '';
      document.getElementById('tray').textContent = `Da mettere · Bianco: ${'⚪'.repeat(s.toPlace.w)}  Nero: ${'⚫'.repeat(s.toPlace.b)}`;
    }

    function finish() {
      if (!lost(s)) return false;
      over = true;
      draw();
      setTimeout(() => {
        if (level === '4' || s.turn === 'b') {
          tune(WIN);
          message('Hai vinto! 🏆', level === '4' ? `Vince il ${s.turn === 'w' ? 'Nero' : 'Bianco'} · Invio per rigiocare` : 'Invio per rigiocare');
        } else {
          tune(LOSE);
          message('Ha vinto il computer', 'Invio per rigiocare');
        }
      }, 400);
      return true;
    }

    function play(m) {
      const millBefore = s.removing;
      s = apply(s, m);
      selected = null;
      beep(s.removing ? 880 : millBefore ? 330 : 520, s.removing ? 0.2 : 0.08);
      draw();
      return finish();
    }

    // The computer plays its whole turn, mill removal included.
    function computerTurn() {
      if (level === '4' || s.turn !== 'b' || over) return;
      thinking = true;
      draw();
      setTimeout(() => {
        const m = bestMove(s, LEVELS[level][1]);
        thinking = false;
        if (m && !play(m)) computerTurn();
      }, 450);
    }

    function pick(i) {
      if (over) return start();
      if (thinking || (level !== '4' && s.turn !== 'w')) return;
      const moves = legalMoves(s);
      let m = null;
      if (s.removing) m = moves.find(x => x.remove === i);
      else if (phase(s) === 'place') m = moves.find(x => x.to === i);
      else if (s.board[i] === s.turn) {
        selected = moves.some(x => x.from === i) && i !== selected ? i : null;
        beep(700, 0.03);
        return draw();
      } else m = moves.find(x => x.from === selected && x.to === i);
      if (!m) return beep(180, 0.08, 'square', 0.05);
      if (!play(m)) computerTurn();
    }

    // Arrow keys jump to the nearest point in that direction.
    addEventListener('keydown', e => {
      const dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
      if (dir) {
        const [cx, cy] = POINTS[cursor];
        let best = -1;
        let bestScore = Infinity;
        POINTS.forEach(([x, y], i) => {
          const along = (x - cx) * dir[0] + (y - cy) * dir[1];
          if (along <= 0) return;
          const score = along + Math.abs((x - cx) * dir[1] + (y - cy) * dir[0]) * 3;
          if (score < bestScore) {
            bestScore = score;
            best = i;
          }
        });
        if (best >= 0) cursor = best;
        draw();
      } else if (e.key === 'Enter' || e.key === ' ') pick(cursor);
      else if (LEVELS[e.key]) {
        level = e.key;
        start();
      } else if (e.key === 'n' || e.key === 'N') start();
    });

    start();
  </script>
</body>
</html>
