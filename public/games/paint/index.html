<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Colora</title>
  <link rel="stylesheet" href="../shell.css">
  <style>
    body { grid-template-columns: auto auto; gap: 4vmin; }
    #picture { width: 70vmin; height: 70vmin; background: #fff; border-radius: 3vmin; }
    #picture [data-part] { cursor: pointer; stroke: #222; stroke-width: 1.4; stroke-linejoin: round; transition: fill 0.2s ease; }
    #picture .outline { fill: none; stroke: #ffb300; stroke-width: 2.5; stroke-dasharray: 4 2; pointer-events: none; }
    #palette { display: grid; grid-template-columns: repeat(2, 9vmin); gap: 1.6vmin; }
    .swatch { width: 9vmin; height: 9vmin; border-radius: 50%; border: 0.8vmin solid transparent; cursor: pointer; }
    .swatch.active { border-color: #fff; transform: scale(1.1); }
  </style>
</head>
<body>
  <svg id="picture" viewBox="0 0 100 100"></svg>
  <div id="palette"></div>
  <p class="hint">← → scegli la parte · ↑ ↓ scegli il colore · Invio colora · D cambia disegno · C cancella</p>
  <script src="../shell.js"></script>
  <script type="module">
    import { beep, tune, WIN } from '../kit.js';

    const COLORS = ['#ff4d4d', '#ff9f1a', '#ffe14d', '#4cd964', '#3fa9f5', '#5856d6', '#ff6bcb', '#8b5a2b', '#1a1a1a', '#ffffff'];
    // Each drawing is a list of SVG shapes; every shape is one area to fill.
    const DRAWINGS = [
      [ // House
        '<rect x="0" y="70" width="100" height="30"/>',
        '<rect x="0" y="0" width="100" height="70"/>',
        '<circle cx="85" cy="15" r="9"/>',
        '<rect x="22" y="42" width="56" height="38"/>',
        '<polygon points="16,44 50,16 84,44"/>',
        '<rect x="43" y="58" width="14" height="22"/>',
        '<rect x="28" y="50" width="11" height="11"/>',
        '<rect x="61" y="50" width="11" height="11"/>',
      ],
      [ // Fish
        '<rect x="0" y="0" width="100" height="100"/>',
        '<ellipse cx="45" cy="50" rx="30" ry="18"/>',
        '<polygon points="72,50 94,34 94,66"/>',
        '<polygon points="38,33 50,20 58,34"/>',
        '<circle cx="28" cy="45" r="4"/>',
        '<circle cx="20" cy="20" r="4"/>',
        '<circle cx="12" cy="32" r="3"/>',
        '<rect x="0" y="86" width="100" height="14"/>',
      ],
      [ // Flower
        '<rect x="0" y="0" width="100" height="80"/>',
        '<rect x="0" y="80" width="100" height="20"/>',
        '<rect x="47" y="45" width="6" height="40"/>',
        '<ellipse cx="38" cy="66" rx="10" ry="5"/>',
        '<circle cx="50" cy="22" r="10"/>',
        '<circle cx="64" cy="34" r="10"/>',
        '<circle cx="50" cy="46" r="10"/>',
        '<circle cx="36" cy="34" r="10"/>',
        '<circle cx="50" cy="34" r="8"/>',
      ],
      [ // Car
        '<rect x="0" y="0" width="100" height="72"/>',
        '<rect x="0" y="72" width="100" height="28"/>',
        '<rect x="10" y="46" width="80" height="20" rx="4"/>',
        '<polygon points="26,46 34,30 66,30 76,46"/>',
        '<polygon points="37,44 41,34 50,34 50,44"/>',
        '<polygon points="54,44 54,34 63,34 69,44"/>',
        '<circle cx="28" cy="68" r="9"/>',
        '<circle cx="72" cy="68" r="9"/>',
      ],
    ];
    const svg = document.getElementById('picture');
    const palette = document.getElementById('palette');
    let drawing = 0;
    let part = 0;
    let color = 0;
    let fills = [];

    function load(n) {
      drawing = n;
      part = 0;
      fills = DRAWINGS[drawing].map(() => '#ffffff');
      draw();
    }

    function draw() {
      svg.innerHTML = DRAWINGS[drawing].join('');
      [...svg.children].forEach((shape, i) => {
        shape.dataset.part = i;
        shape.setAttribute('fill', fills[i]);
        shape.addEventListener('click', () => {
          part = i;
          paint();
        });
      });
      // Outline of the chosen part drawn on top: moving the part itself would hide the others.
      const outline = svg.children[part].cloneNode();
      outline.removeAttribute('data-part');
      outline.setAttribute('class', 'outline');
      svg.append(outline);
      palette.replaceChildren(...COLORS.map((c, i) => {
        const s = document.createElement('div');
        s.className = `swatch${i === color ? ' active' : ''}`;
        s.style.background = c;
        s.addEventListener('click', () => {
          color = i;
          draw();
        });
        return s;
      }));
    }

    function paint() {
      fills[part] = COLORS[color];
      beep(300 + color * 60, 0.1, 'triangle');
      draw();
      if (fills.every(f => f !== '#ffffff') && !fills.done) {
        fills.done = true;
        tune(WIN);
      }
    }

    addEventListener('keydown', e => {
      const n = DRAWINGS[drawing].length;
      if (e.key === 'ArrowRight') part = (part + 1) % n;
      else if (e.key === 'ArrowLeft') part = (part - 1 + n) % n;
      else if (e.key === 'ArrowDown') color = (color + 1) % COLORS.length;
      else if (e.key === 'ArrowUp') color = (color - 1 + COLORS.length) % COLORS.length;
      else if (e.key === 'Enter' || e.key === ' ') return paint();
      else if (e.key === 'd' || e.key === 'D') return load((drawing + 1) % DRAWINGS.length);
      else if (e.key === 'c' || e.key === 'C') return load(drawing);
      else return;
      draw();
    });

    load(0);
  </script>
</body>
</html>
