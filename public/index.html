<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>L’Isola dei Bimbi</title>
  <link rel="icon" href="favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="theme-color" content="#1b1740">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="home"></main>

  <section id="search" hidden>
    <header class="series-head">
      <button class="back" aria-label="Indietro"></button>
      <input id="search-input" type="search" placeholder="Cerca un cartone…" autocomplete="off" spellcheck="false">
    </header>
    <div id="search-results"></div>
  </section>

  <section id="library" hidden>
    <header class="series-head">
      <button class="back" aria-label="Indietro"></button>
      <h1 id="library-title"></h1>
    </header>
    <div id="library-items"></div>
  </section>

  <section id="info" hidden>
    <div id="info-backdrop" class="info-backdrop"></div>
    <header class="series-head">
      <button class="back" aria-label="Indietro"></button>
    </header>
    <div id="info-body" class="info-main"></div>
    <div id="episodes"></div>
  </section>

  <div id="game" hidden>
    <iframe id="game-frame" sandbox="allow-scripts" title="Gioco"></iframe>
    <button class="back" aria-label="Indietro"></button>
  </div>

  <div id="player" hidden>
    <video id="video" controls controlslist="nodownload noremoteplayback noplaybackrate" disablepictureinpicture></video>
    <button class="back" aria-label="Indietro"></button>
  </div>

  <dialog id="about" class="about">
    <div id="about-body"></div>
    <form method="dialog"><button class="action primary">Chiudi</button></form>
  </dialog>

  <div id="toast" hidden></div>

  <script src="vendor/hls.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
